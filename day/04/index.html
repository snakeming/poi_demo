一直盛‼️\n\n🥢#鹽酥溪蝦豆腐 $𝟰𝟬𝟬\n\n這道推薦給愛吃溪蝦的人🦐因為蝦子真的好多XD溪蝦和豆腐都炸得酥脆，再加上蔥蒜調味，稍微有點辣度🌶️不過比較推薦給口味較重的人，吃到後面會稍鹹一點～\n\n——🅘🅝🅕🅞——\n\n📍 #好雞婆土雞城\n▫️營業時間：週一至週日11:00-14:00、17:00-20:00\n▫️地址：546南投縣仁愛鄉博望巷36之3號\n▫️電話：04 9280 3016&quot;],&quot;url&quot;:[0,&quot;https://www.instagram.com/p/DHImHgoSWnE?igsi=MXQ1cXlicWFlam9kNg%3D%3D&quot;],&quot;rating&quot;:[0,2],&quot;notes&quot;:[1,[]]}],[0,{&quot;id&quot;:[0,&quot;清境_二店_雞大王活蝦啤酒城&quot;],&quot;name&quot;:[0,&quot;二店 雞大王活蝦啤酒城&quot;],&quot;category&quot;:[0,&quot;restaurant&quot;],&quot;coordinates&quot;:[0,{&quot;lat&quot;:[0,24.06692857171721],&quot;lng&quot;:[0,121.16711894896402]}],&quot;navQuery&quot;:[0,&quot;南投縣仁愛鄉仁和路224號附1&quot;],&quot;description&quot;:[0,&quot;這家在Google評論1200多則，有4.7顆星⭐\n點的幾樣特色菜都蠻好吃的👍\n有提供兩人以上套餐或是單點(建議點套餐最划算)\n\n客家香煎芋絲糕  吃得到濃濃的芋頭味，芋頭控必點\n椒麻皮蛋  辣辣麻麻超開胃超級下飯！\n特色菜老台菜煎豬肝  鮮嫩脆口沒有腥味，調味上也好吃，有讓我驚艷到(建議要儘快吃)\n帶有中藥香氣的窯烤甕仔雞  外皮烤得金黃酥脆，撥開還會流湯汁\n因為是使用放山土雞，雞肉吃起來不柴很有口感\n單吃或是沾著特製的胡椒鹽與雞油都好吃\n可以請店員桌邊服務剝雞，或是想要自己剝也可以唷～\n\n他們家的鱘龍魚可是使用合歡山泉水飼養\n有三種料理方式，可以做成湯、清蒸或是三杯（最多可任選2種）\n肉質細緻Ｑ彈沒有土味，不管是三杯或是清蒸都賀甲😋\n香菇雞湯 滿滿的雞肉跟香菇，湯頭甘甜越喝越順口，天冷喝碗熱湯有夠暖身👍\n店內用餐環境寬敞舒適\n停車位也很多，還有民宿至餐廳的免費接駁服務🚗\n（詳細資訊可詢問店家）\n去南投清境玩時可以吃看看喔～\n\n窯烤甕仔雞$700\n活鱘龍魚兩吃$2000(三杯/清蒸)\n客家香煎芋絲糕(S)$400\n椒麻皮蛋(S)$380\n老台菜煎豬肝(S)$380\n高山鮮時蔬菜(S)$250\n高山櫛瓜(S)$250\n香菇雞湯(S)$350\n雞油拌飯$25/碗\n\n@chickenking.cj\n雞大王活蝦啤酒城旗艦店\n地址：54641南投縣仁愛鄉信義巷34-9號\n電話：049-2802622\n營業時間11:00-20:00\n\n二店 雞大王活蝦啤酒城\n地址：南投縣仁愛鄉仁和路224號附1\n（清境最高7-11、全家隔壁）\n電話：049-2802688\n營業時間11:00-20:00&quot;],&quot;url&quot;:[0,&quot;https://www.instagram.com/reel/C4p4iJHvp8X?igsi=MTB5bndqZzFsa3lteA%3D%3D&quot;],&quot;rating&quot;:[0,2],&quot;notes&quot;:[1,[]]}],[0,{&quot;id&quot;:[0,&quot;南投_來福居會館&quot;],&quot;name&quot;:[0,&quot;來福居會館&quot;],&quot;category&quot;:[0,&quot;cafe&quot;],&quot;coordinates&quot;:[0,{&quot;lat&quot;:[0,24.041244040523214],&quot;lng&quot;:[0,121.15853644387026]}],&quot;navQuery&quot;:[0,&quot;南投縣仁愛鄉大同村18-7號&quot;],&quot;description&quot;:[0,&quot;景色環繞很不真實，推薦露天座位區，餐點口味不錯\n\n這間南投咖啡廳，我原本是被綠植感的玻璃屋吸引去\n但最後發現景色才是真的美，山景環繞很不真實❤ \n(湯品還有 #阿嬤的九尾雞 和 #金針什錦湯 ，九尾雞好像也超多人推，下次也想試)\n\n另外很推薦可以+$𝟮𝟱升級 #雞油拌麵 ，拌麵我們都超愛😋雞油鹹香搭配Q彈麵條超涮嘴，明明飽了卻還是忍不住一直盛‼️\n\n🥢#鹽酥溪蝦豆腐 $𝟰𝟬𝟬\n\n這道推薦給愛吃溪蝦的人🦐因為蝦子真的好多XD溪蝦和豆腐都炸得酥脆，再加上蔥蒜調味，稍微有點辣度🌶️不過比較推薦給口味較重的人，吃到後面會稍鹹一點～\n\n——🅘🅝🅕🅞——\n\n📍 #好雞婆土雞城\n▫️營業時間：週一至週日11:00-14:00、17:00-20:00\n▫️地址：546南投縣仁愛鄉博望巷36之3號\n▫️電話：04 9280 3016&quot;],&quot;url&quot;:[0,&quot;https://www.instagram.com/p/DHImHgoSWnE?igsi=MXQ1cXlicWFlam9kNg%3D%3D&quot;],&quot;rating&quot;:[0,2],&quot;notes&quot;:[1,[]],&quot;waypointIndex&quot;:[0],&quot;tier&quot;:[0,&quot;recommended&quot;]}],[0,{&quot;id&quot;:[0,&quot;南投_七里香甕仔雞-清境埔霧公路店&quot;],&quot;name&quot;:[0,&quot;七里香甕仔雞-清境埔霧公路店&quot;],&quot;category&quot;:[0,&quot;restaurant&quot;],&quot;coordinates&quot;:[0,{&quot;lat&quot;:[0,23.979550485051778],&quot;lng&quot;:[0,121.01023836035016]}],&quot;navQuery&quot;:[0,&quot;南投縣埔里鎮中山路一段171號&quot;],&quot;description&quot;:[0,&quot;超爆汁的甕仔雞💦 高CP值多人聚餐出遊推薦 #七里香甕仔雞\n-\n多人套餐\n◻️三菜一湯B（2-4人） $980\n。甕仔雞 \n。雪花肉炒脆瓜 。酸筍絲炒空心菜\n。筍湯 。大碗公白飯\n選擇障礙的人直接點配好的套餐就對了！而且筍湯和白飯都可以無限續🙌🏻\n甕仔雞都是燒柴火控窯，由專人掌握做精準的熟度。雞皮色澤超美！油亮油亮還超多汁！外皮酥脆、肉質嫩口juicy\n雪花肉炒脆瓜也是一道下飯神菜耶～脆瓜鹹香帶點酸、尾韻還有點甜\n空心菜搭配大量的蒜頭爆炒，酸筍更帶出了不同層次\n\n◻️野生當歸煎蛋 $150/小\n外皮煎到油亮油亮，熱熱送上桌時聞到濃郁的當歸香味，但是完全當歸藥材味！害怕當歸中藥味的人也可以試試！\n\n◻️鹽酥溪蝦 $250\n炸溪蝦吃過很多，但這家真的非常厲害！外層裹上薄薄的粉炸到金黃酥脆，每口都嘎嘣脆。大量蒜頭、青蔥跟胡椒鹽超級涮嘴！有夠下酒欸\n\n◻️七里香烏龍茶 $120\n吃熱炒配無糖茶解膩最對味！\n茶香回甘不苦澀 \n\n【七里香甕仔雞-清境埔霧公路店】\n🔗@cilisiang2004\n🏠南投縣埔里鎮中山路一段171號\n☎️ 04-9299-9869\n⏰10:30-19:30，六日10:00-20:00\n(中南部有九家分店）&quot;],&quot;url&quot;:[0,&quot;https://www.instagram.com/reel/C-9-Kh1vs-_?igsi=MThhdnI3azZrbm1jdQ%3D%3D&quot;],&quot;rating&quot;:[0,3],&quot;notes&quot;:[1,[]],&quot;waypointIndex&quot;:[0],&quot;tier&quot;:[0,&quot;optional&quot;]}],[0,{&quot;id&quot;:[0,&quot;南投_茲心園&quot;],&quot;name&quot;:[0,&quot;茲心園&quot;],&quot;category&quot;:[0,&quot;lodging&quot;],&quot;coordinates&quot;:[0,{&quot;lat&quot;:[0,24.033320119054967],&quot;lng&quot;:[0,121.15397707579237]}],&quot;navQuery&quot;:[0,&quot;546台灣南投縣仁愛鄉&quot;],&quot;description&quot;:[0,&quot;茲心園 \n馬術表演&quot;],&q
