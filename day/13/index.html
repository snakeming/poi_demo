;:[0,&quot;09:30–12:00\n先逛 駁二藝術特區，一路可以走大港橋、舊港區、哈瑪星。如果對鐵路有興趣，可加哈瑪星台灣鐵道館；不感興趣就把時間留給戶外。\n\n12:00–13:00\n鹽埕附近午餐。這餐很適合吃一些高雄傳統小吃，不必特意找漂亮餐廳。\n\n13:00–18:00｜旗津\n自駕遊旗津我反而不建議把汽車開過去。車停鼓山／哈瑪星一帶，坐渡輪過去通常更輕鬆。\n\n抵達 旗津老街 後，可以走：\n\n旗津老街 → 海岸 → 旗後砲臺 → 高雄燈塔 → 看日落。\n\n旗後砲臺本身就是很好的高雄港觀景點，可同時看到港口、外海及城市天際線。高雄燈塔目前每天 10:00–21:00 開放，所以不用怕日落後立即關門。\n\n我會建議日落前約 60–90 分鐘開始往砲臺、燈塔方向走，不要下午兩三點已經爬上去曝曬。\n\n18:30 之後\n渡輪回鼓山。晚上可以回駁二、大港橋，或者去夜市。&quot;],&quot;areaFiles&quot;:[1,[[0,&quot;kaohsiung&quot;]]],&quot;plannedPlaces&quot;:[1,[[0,&quot;高雄_德國旋轉烤肉&quot;],[0,&quot;高雄_星空隧道&quot;],[0,&quot;高雄_六合夜市&quot;],[0,&quot;高雄_光華觀光夜市&quot;]]],&quot;recommendedPlaces&quot;:[1,[[0,&quot;高雄_龍虎塔_左營&quot;]]],&quot;driving&quot;:[0,{&quot;level&quot;:[0,&quot;low&quot;],&quot;roads&quot;:[1,[]],&quot;notes&quot;:[1,[[0,&quot;以步行及短程交通為主&quot;]]]}]}],[0,{&quot;day&quot;:[0,10],&quot;date&quot;:[0,&quot;2026-11-28&quot;],&quot;stayArea&quot;:[0,&quot;tainan&quot;],&quot;stayLabel&quot;:[0,&quot;台南&quot;],&quot;shortTitle&quot;:[0,&quot;台南&quot;],&quot;title&quot;:[0,&quot;高雄 → 台南&quot;],&quot;theme&quot;:[0,&quot;野森動物學校、旗山老街；台南府城核心；燒肉/火鍋&quot;],&quot;areaFiles&quot;:[1,[[0,&quot;kaohsiung&quot;],[0,&quot;tainan&quot;]]],&quot;route&quot;:[0,&quot;day-10&quot;],&quot;plannedPlaces&quot;:[1,[[0,&quot;高雄_六合二路&quot;],[0,&quot;高雄_成佛大道&quot;],[0,&quot;高雄_野森動物學校&quot;],[0,&quot;高雄_旗山老街&quot;],[0,&quot;高雄_內門紫竹寺&quot;],[0,&quot;tainan_公正里&quot;],[0,&quot;tainan_guohua_street&quot;],[0,&quot;tainan_shennong_street&quot;]]],&quot;recommendedPlaces&quot;:[1,[[0,&quot;高雄_將軍漁港&quot;],[0,&quot;tainan_水恃&quot;],[0,&quot;tainan_居心地安平&quot;],[0,&quot;高雄_美濃&quot;],[0,&quot;台南_OAKLA&amp;BARK&quot;],[0,&quot;tainan_臺南孔廟&quot;],[0,&quot;tainan_赤崁樓&quot;],[0,&quot;台南_「平價」燒肉政宗_台南店&quot;],[0,&quot;tainan_川蜀三國火鍋&quot;]]],&quot;driving&quot;:[0,{&quot;level&quot;:[0,&quot;low&quot;],&quot;roads&quot;:[1,[[0,&quot;國道1號／主要西部道路&quot;]]],&quot;notes&quot;:[1,[[0,&quot;星期六抵達台南後停車&quot;],[0,&quot;下午及晚上以步行為主&quot;]]]}]}],[0,{&quot;day&quot;:[0,11],&quot;dat
