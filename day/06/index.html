t;lng&quot;:[0,121.08429360426553]}],&quot;navQuery&quot;:[0,&quot;546台灣南投縣仁愛鄉南豐村中正路88-3號&quot;],&quot;description&quot;:[0,&quot;前往清境、合歡山\n超讚的休息中繼站\n餐點質感好\n可頌小點可以外帶，路途上享用&quot;],&quot;url&quot;:[0,&quot;https://www.instagram.com/reel/DYl_AjMJ-C_?igsi=bnh1dHN0M3pob2dz&quot;],&quot;rating&quot;:[0,2],&quot;notes&quot;:[1,[]],&quot;waypointIndex&quot;:[0]}],[0,{&quot;id&quot;:[0,&quot;南投_Mountain_Bica_Cafe&quot;],&quot;name&quot;:[0,&quot;Mountain Bica Cafe&quot;],&quot;category&quot;:[0,&quot;cafe&quot;],&quot;categoryLabel&quot;:[0,&quot;咖啡甜點&quot;],&quot;coordinates&quot;:[0,{&quot;lat&quot;:[0,24.031471097191638],&quot;lng&quot;:[0,121.14292805767519]}],&quot;navQuery&quot;:[0,&quot;南投縣仁愛鄉信義巷34-11附1號&quot;],&quot;description&quot;:[0,&quot;藏在山裏的寶藏咖啡廳\n來清境不來這間太可惜了.ᐟ.ᐟ\n大片落地窗 還能一覽無遺山景\n一待就好幾個小時根本捨不得離開\n\nB1窗邊座位可以看到整片山景\n私心推 #有木奶茶 真的很好喝\n非常濃郁的奶茶\n有著黑糖、焦糖脆片的點綴\n\n上山想休息一下，這裏絕對是最好的選擇\n因為沒辦法訂位 建議提早到現場呦～\n才會順利坐到靠窗位置\n\n♡ Mountain Bica Cafe\n♡南投縣仁愛鄉信義巷34-11附1號\n♡不接受訂位\n♡寵物友善🐈‍⬛\n♡營業時間：10:00-18:00&quot;],&quot;url&quot;:[0,&quot;https://www.instagram.com/reel/DDMxRqaSFwq?igsi=cDQzcngzaTdvNmcz&quot;],&quot;rating&quot;:[0,4],&quot;notes&quot;:[1,[]],&quot;waypointIndex&quot;:[0]}],[0,{&quot;id&quot;:[0,&quot;清境_好雞婆土雞城&quot;],&quot;name&quot;:[0,&quot;好雞婆土雞城&quot;],&quot;category&quot;:[0,&quot;restaurant&quot;],&quot;categoryLabel&quot;:[0,&quot;餐廳&quot;],&quot;coordinates&quot;:[0,{&quot;lat&quot;:[0,24.074415200688215],&quot;lng&quot;:[0,121.16903620387414]}],&quot;navQuery&quot;:[0,&quot;546南投縣仁愛鄉博望巷36之3號&quot;],&quot;description&quot;:[0,&quot;好雞婆土雞城\n\n去 #清境農場 玩不知道吃什麼嗎⁉️\n\n推薦給你們這家合菜料理(不是葉配🍃)，距離 #青青草原 車程只要4分鐘，家人吃下來都一致推薦👍🏻價格合理、分量剛好，環境還超美又舒服，服務人員態度也很親切。\n\n除了在山上平常沒辦法常來吃，不然沒什麼缺點XDD\n\n剛入店時會要先在門口點完餐才帶位唷～座位基本都是包廂，人數較少可能會和其他組人同個包廂，但間隔不會顯得太侷促。\n\n——🅕🅞🅞🅓——\n\n我們是4人用餐，推薦點【雙人套餐再+兩道菜】，份量較剛好，吃完很有飽足感！\n(胃口較小的可以再少點一道菜)\n\n🍗 #雙人烤雞套餐$𝟭𝟭𝟴𝟬\n含香草烤雞、季節時蔬、香椿煎蛋/酥炸刺蔥豆腐、湯品(三擇一) \n\n當天到店內雖然可以現場點烤雞，實際上是要先預訂的，建議可以先和店家確認～\n\n烤雞都是現烤熱騰騰的，有附隔熱手套讓大家扒開雞肉，外皮油亮、烤得有脆度，裡面的雞肉肉質多汁又軟嫩，還有保留雞爪可以ㄘㄥˋ！硬要說缺點的部分是雞頭沒有拔掉(個人稍微比較不愛XD)\n\n時蔬部分我們還有加點一份，所以 #炒高麗菜 和 #甘蔗筍 都有吃到(皆是 $𝟮𝟮𝟬)\n\n高麗菜炒得很有水準，帶有脆度又保有水分，不過略油一點(可以接受的程度)，甘蔗筍搭配黃瓜一起料理，食材都吃得出很新鮮，和高麗菜一樣多汁又有脆度～\n\n湯品選擇的是 #奶奶的鳳梨苦瓜雞 🍲非常推薦✨雞肉和苦瓜都給很多，重點是湯頭：非！常！好！喝！ #不敢吃苦瓜的也會愛喝的湯 ，煮入雞肉的鮮甜和苦瓜的香氣，非常順口、一碗接一碗，喝完也不會口乾舌燥～\n\n(湯品還有 #阿嬤的九尾雞 和 #金針什錦湯 ，九尾雞好像也超多人推，下次也想試)\n\n另外很推薦可以+$𝟮𝟱升級 #雞油拌麵 ，拌麵我們都超愛😋雞油鹹香搭配Q彈麵條超涮嘴，明明飽了卻還是忍不住一直盛‼️\n\n🥢#鹽酥溪蝦豆腐 $𝟰𝟬𝟬\n\n這道推薦給愛吃溪蝦的人🦐因為蝦子真的好多XD溪蝦和豆腐都炸得酥脆，再加上蔥蒜調味，稍微有點辣度🌶️不過比較推薦給口味較重的人，吃到後面會稍鹹一點～\n\n——🅘🅝🅕🅞——\n\n📍 #好雞婆土雞城\n▫️營業時間：週一至週日11:00-14:00、17:00-20:00\n▫️地址：546南投縣仁愛鄉博望巷36之3號\n▫️電話：04 9280 3016&quot;],&quot;url&quot;:[0,&quot;https://www.instagram.com/p/DHImHgoSWnE?igsi=MXQ1cXlicWFlam9kNg%3D%3D&quot;],&quot;rating&quot;:[0,2],&quot;notes&quot;:[1,[]],&quot;waypointIndex&quot;:[0]}],[0,{&quot;id&quot;:[0,&quot;南投_七里香甕仔雞-清境埔霧公路店&quot;],&quot;name&quot;:[0,&quot;七里香甕仔雞-清境埔霧公路店&quot;],&quot;category&quot;:[0,&quot;restaurant&quot;],&quot;categoryLabel&quot;:[0,&quot;餐廳&quot;],&quot;coordinates&quot;:[0,{&quot;lat&quot;:[0,23.979550485051778],&quot;lng&quot;:[0,121.01023836035016]}],&quot;navQuery&quot;:[0,&quot;南投縣埔里鎮中山路一段171號&quot;],&quot;description&quot;:[0,&quot;超爆汁的甕仔雞💦 高CP值多人聚餐出遊推薦 #七里香甕仔雞\n-\n多人套餐\n◻️三菜一湯B（2-4人） $980\n。甕仔雞 \n。雪花肉炒脆瓜 。酸筍絲炒空心菜\n。筍湯 。大碗公白飯\n選擇障礙的人直接點配好的套餐就對了！而且筍湯和白飯都可以無限續🙌🏻\n甕仔雞都是燒柴火控窯，由專人掌握做精準的熟度。雞皮色澤超美！油亮油亮還超多汁！外皮酥脆、肉質嫩口juicy\n雪花肉炒脆瓜也是一道下飯神菜耶～脆瓜鹹香帶點酸、尾韻還有點甜\n空心菜搭配大量的蒜頭爆炒，酸筍更帶出了不同層次\n\n◻️野生當歸煎蛋 $150/小\n外皮煎到油亮油亮，熱熱送上桌時聞到濃郁的當歸香味，但是完全當歸藥材味！害怕當歸中藥味的人也可以試試！\n\n◻️鹽酥溪蝦 $250\n炸溪蝦吃過很多，但這家真的非常厲害！外層裹上薄薄的粉炸到金黃酥脆，每口都嘎嘣脆。大量蒜頭、青蔥跟胡椒鹽超級涮嘴！有夠下酒欸\n\n◻️七里香烏龍茶 $120\n吃熱炒配無糖茶解膩最對味！\n茶香回甘不苦澀 \n\n【七里香甕仔雞-清境埔霧公路店】\n🔗@cilisiang2004\n🏠南投縣埔里鎮中山路一段171號\n☎️ 04-9299-9869\n⏰10:30-19:30，六日10:00-20:00\n(中南部有九家分店）&quot;],&quot;url&quot;:[0,&quot;https://www.instagram.com/reel/C-9-Kh1vs-_?igsi=MThhdnI3azZrbm1jdQ%3D%3D&quot;],&quot;rating&quot;:[0,3],&quot;notes&quot;:[1,[]],&quot;waypointIndex&quot;:[0]}],[0,{&quot;id&quot;:[0,&quot;南投_茲心園&quot;],&quot;name&quot;:[0,&quot;茲心園&quot;],&quot;category&quot;:[0,&quot;lodging&quot;],&quot;catego
