分是雞頭沒有拔掉(個人稍微比較不愛XD)\n\n時蔬部分我們還有加點一份，所以 #炒高麗菜 和 #甘蔗筍 都有吃到(皆是 $𝟮𝟮𝟬)\n\n高麗菜炒得很有水準，帶有脆度又保有水分，不過略油一點(可以接受的程度)，甘蔗筍搭配黃瓜一起料理，食材都吃得出很新鮮，和高麗菜一樣多汁又有脆度～\n\n湯品選擇的是 #奶奶的鳳梨苦瓜雞 🍲非常推薦✨雞肉和苦瓜都給很多，重點是湯頭：非！常！好！喝！ #不敢吃苦瓜的也會愛喝的湯 ，煮入雞肉的鮮甜和苦瓜的香氣，非常順口、一碗接一碗，喝完也不會口乾舌燥～\n\n(湯品還有 #阿嬤的九尾雞 和 #金針什錦湯 ，九尾雞好像也超多人推，下次也想試)\n\n另外很推薦可以+$𝟮𝟱升級 #雞油拌麵 ，拌麵我們都超愛😋雞油鹹香搭配Q彈麵條超涮嘴，明明飽了卻還是忍不住一直盛‼️\n\n🥢#鹽酥溪蝦豆腐 $𝟰𝟬𝟬\n\n這道推薦給愛吃溪蝦的人🦐因為蝦子真的好多XD溪蝦和豆腐都炸得酥脆，再加上蔥蒜調味，稍微有點辣度🌶️不過比較推薦給口味較重的人，吃到後面會稍鹹一點～\n\n——🅘🅝🅕🅞——\n\n📍 #好雞婆土雞城\n▫️營業時間：週一至週日11:00-14:00、17:00-20:00\n▫️地址：546南投縣仁愛鄉博望巷36之3號\n▫️電話：04 9280 3016&quot;],&quot;url&quot;:[0,&quot;https://www.instagram.com/p/DHImHgoSWnE?igsi=MXQ1cXlicWFlam9kNg%3D%3D&quot;],&quot;rating&quot;:[0,2],&quot;notes&quot;:[1,[]],&quot;waypointIndex&quot;:[0],&quot;tier&quot;:[0,&quot;optional&quot;]}],[0,{&quot;id&quot;:[0,&quot;南投_七里香甕仔雞-清境埔霧公路店&quot;],&quot;name&quot;:[0,&quot;七里香甕仔雞-清境埔霧公路店&quot;],&quot;category&quot;:[0,&quot;restaurant&quot;],&quot;coordinates&quot;:[0,{&quot;lat&quot;:[0,23.979550485051778],&quot;lng&quot;:[0,121.01023836035016]}],&quot;navQuery&quot;:[0,&quot;南投縣埔里鎮中山路一段171號&quot;],&quot;description&quot;:[0,&quot;超爆汁的甕仔雞💦 高CP值多人聚餐出遊推薦 #七里香甕仔雞\n-\n多人套餐\n◻️三菜一湯B（2-4人） $980\n。甕仔雞 \n。雪花肉炒脆瓜 。酸筍絲炒空心菜\n。筍湯 。大碗公白飯\n選擇障礙的人直接點配好的套餐就對了！而且筍湯和白飯都可以無限續🙌🏻\n甕仔雞都是燒柴火控窯，由專人掌握做精準的熟度。雞皮色澤超美！油亮油亮還超多汁！外皮酥脆、肉質嫩口juicy\n雪花肉炒脆瓜也是一道下飯神菜耶～脆瓜鹹香帶點酸、尾韻還有點甜\n空心菜搭配大量的蒜頭爆炒，酸筍更帶出了不同層次\n\n◻️野生當歸煎蛋 $150/小\n外皮煎到油亮油亮，熱熱送上桌時聞到濃郁的當歸香味，但是完全當歸藥材味！害怕當歸中藥味的人也可以試試！\n\n◻️鹽酥溪蝦 $250\n炸溪蝦吃過很多，但這家真的非常厲害！外層裹上薄薄的粉炸到金黃酥脆，每口都嘎嘣脆。大量蒜頭、青蔥跟胡椒鹽超級涮嘴！有夠下酒欸\n\n◻️七里香烏龍茶 $120\n吃熱炒配無糖茶解膩最對味！\n茶香回甘不苦澀 \n\n【七里香甕仔雞-清境埔霧公路店】\n🔗@cilisiang2004\n🏠南投縣埔里鎮中山路一段171號\n☎️ 04-9299-9869\n⏰10:30-19:30，六日10:00-20:00\n(中南部有九家分店）&quot;],&quot;url&quot;:[0,&quot;https://www.instagram.com/reel/C-9-Kh1vs-_?igsi=MThhdnI3azZrbm1jdQ%3D%3D&quot;],&quot;rating&quot;:[0,3],&quot;notes&quot;:[1,[]],&quot;waypointIndex&quot;:[0],&quot;tier&quot;:[0,&quot;optional&quot;]}],[0,{&quot;id&quot;:[0,&quot;南投_茲心園&quot;],&quot;name&quot;:[0,&quot;茲心園&quot;],&quot;categor
