線。\n\n但真正走過幾次後，會發現它其實不是為旅人長出來的。\n\n這裡原本就在舊下大道與南廠生活圈之間，靠近過去港道、船廠與保安宮。後來圓環拆除、攤商移動，一間間老店才慢慢在保安路落腳。今天看到的「美食街」，其實是幾十年生活累積下來的結果。\n\n如果從一閑間出發，我會建議不要一次點太多，每間分著吃，反而最有意思。\n\n📍浮水魚羹｜先從葉鳳浮水虱目魚羹開始。1957 年做到現在，虱目魚做成的羹塊煮熟後浮上水面，「浮水魚羹」這個名字也就這樣留下來。\n📍香腸熟肉｜阿龍香腸熟肉 更像台南人的黑白切。站在玻璃櫃前看著一盤盤熟肉，想吃什麼就指什麼，再來一碗肉燥飯，很簡單。\n📍鍋燒意麵｜走到 醇涎坊古早味鍋燒意麵，會看到另一種台南味。鮮甜湯頭、炸意麵、半熟蛋，沒有太多花樣，卻很容易讓人記住。\n📍杏仁茶｜最後把胃留一點位置給 阿卿杏仁茶。夏天來碗杏仁豆腐冰，天涼時換成熱杏仁茶配油條，剛好把一路的鹹香慢慢收掉。\n📍王宮口｜吃完再往 南廠保安宮 走。這座主祀五府千歲的老廟，和南廠這一帶的生活一起存在了幾百年。站在廟前再回頭看那些招牌，會比較明白為什麼保安路一直這麼熱鬧。\n\n保安路不一定要安排成「五間必吃」。\n\n比較喜歡的方式，是兩個人點一碗、切一盤、再分一份甜湯。一路走、一路吃，也順便看看街上的招牌、廟口和騎樓。\n\n台南好吃的地方很多。\n但有些街道，連吃東西這件事本身，都還留著城市生活的樣子。&quot;],&quot;url&quot;:[0,&quot;https://www.instagram.com/p/Dd3xqF6kiBg?img_index=5&amp;stkn=bmw0OXE5eHVtc2Ft&quot;],&quot;rating&quot;:[0,null],&quot;notes&quot;:[1,[]],&quot;waypointIndex&quot;:[0],&quot;tier&quot;:[0,&quot;optional&quot;]}],[0,{&quot;id&quot;:[0,&quot;台南_台南二日遊_老厝1933&quot;],&quot;name&quot;:[0,&quot;台南二日遊 老厝1933&quot;],&quot;category&quot;:[0,&quot;other&quot;],&quot;coordinates&quot;:[0,{&quot;lat&quot;:[0,22.99035760543043],&quot;lng&quot;:[0,120.2103861126887]}],&quot;navQuery&quot;:[0,&quot;No. 27號, Lane 51, Section 1, Beimen Rd, Chenghuang Village, West Central District, Tainan City, Taiwan 700&quot;],&quot;description&quot;:[0,&quot;台南二日遊✨～可以這樣安排！\n入住休日行旅，\n\n餐桌上的鹿早\n22.993383387725974, 120.2098950713705\n阿美嬤紅茶奶-開山店\n22.991680035643352, 120.20588515550077\n\n衝極商店\n22.992397352342167, 120.20694657006077\n\nTen Drum Cultural Village 十鼓文創\n22.938412560941, 120.22959414286045\n\n喧宵いざかや\n22.989707658041038, 120.19783382855827&quot;],&quot;url&quot;:[0,&quot;https://www.instagram.com/reel/Ddgne7yvs3V?stkn=N3dnN2l1dTEzZGFn&quot;],&quot;rating&quot;:[0,null],&quot;notes&quot;:[1,[]],&quot;waypointIndex&quot;:[0],&quot;tier&quot;:[0,&quot;optional&quot;]}],[0,{&quot;id&quot;:[0,&quot;台南_中村文御_台南・西門の菓子店&quot;],&quot;name&quot;:[0,&quot;中村文御 台南・西門の菓子店&quot;],&quot;category&quot;:[0,&quot;cafe&quot;],&quot;coordinates&quot;:[0,{&quot;lat&quot;:[0,22.99
