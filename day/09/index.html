坐在燈塔旁吹吹海風、欣賞旗津彩虹屋🌈\n\n接著一路走到旗津碼頭，再逛旗津老街～\n\n🍠 椪嫂蕃薯椪\n🦐 旗后海產\n🍡 香可兒白糖粿\n🍅 旗后大碗冰切盤蕃茄\n\n從白天一路玩到晚上，\n這趟旗津一日遊就是海景、美食、咖啡全部都有❤️\n\n如果你也想來旗津玩一天，\n可以把這篇收藏起來，下次直接照著玩！&quot;],&quot;url&quot;:[0,&quot;https://www.instagram.com/reel/DeTDSEBTYyx?obrf=MWczbXgxcHFlZWIyZQ%3D%3D&quot;],&quot;rating&quot;:[0,4],&quot;notes&quot;:[1,[]],&quot;waypointIndex&quot;:[0,2]}],[0,{&quot;id&quot;:[0,&quot;高雄_六合夜市&quot;],&quot;name&quot;:[0,&quot;六合夜市&quot;],&quot;category&quot;:[0,&quot;night_market&quot;],&quot;coordinates&quot;:[0,{&quot;lat&quot;:[0,22.63209585917898],&quot;lng&quot;:[0,120.29912346847235]}],&quot;navQuery&quot;:[0,&quot;六合夜市&quot;],&quot;description&quot;:[0,&quot;國內外觀光客、旅客； 高雄市六合國際觀光夜市； AI：招牌必喝 / 飲品與甜點\n• 鄭老牌木瓜牛奶（六合二路1號）：濃郁香甜的招牌木瓜牛奶，老闆娘記憶力好、出餐快，是夜市必喝代表\n• 老江紅茶牛奶南台總店（南台路51號）：飄香超過70年的24小時老字號，招牌紅茶牛奶搭配吐司、蛋餅。\n• 六合王牌傳統豆花（六合二路89號）：配料豐富的綜合豆花（綠豆、紅豆、薏仁、花生、芋泥、粉圓），口感滑順不甜膩\n\n經典主食與海鮮\n• 莊記海產粥 / 鹽蒸蝦 / 鹽蒸蚵（六合二路94號／130號）：現點現煮、料多實在的海鮮粥與鹹鮮夠味的鹽蒸海鮮。\n• 光頭老闆鐵板炒飯（南台路80號）：帶有獨特大火鑊氣與鐵板香氣的肉絲蛋炒飯，粒粒分明。\n• 楊家肉圓．刈包（六合二路57號）：老牌傳統小吃，Q彈肉圓與經典刈包。\n• 方記水餃：皮薄餡多、受歡迎的銅板價水餃。\n\n特色小吃與燒烤\n• 盛奕大腸包小腸（六合二路73號）：提供九層塔、紅麴、藜麥、咖哩等多種口味米腸，炭烤香氣十足。\n• 烤肉之家（六合二路40號）：炭火直烤的串燒與肉串，香氣四溢的宵夜名攤。\n• 小東北鍋包肉：外酥內嫩、酸甜涮嘴的東北特色小吃。\n• 老正興館金牌蔥油餅（自立二路75號，夜市旁步行2分鐘）：手工現做、外酥內Q的北方麵食與小籠包。\n• 蔡家烏魚子（六合二路112號）：現烤或切片烏魚子，是順路品嚐的高雄在地風味。\n； https://www.instagram.com/reel/DXouu6WDydS?stkn=MXZmMjh0Zm1yamlnbw%3D%3D&quot;],&quot;url&quot;:[0,&quot;https://margaret.tw/post-46307311/&quot;],&quot;rating&quot;:[0,null],&quot;notes&quot;:[1,[]],&quot;waypointIndex&quot;:[0,3]}],[0,{&quot;id&quot;:[0,&quot;高雄_光華觀光夜市&quot;],&quot;name&quot;:[0,&quot;光華觀光夜市&quot;],&quot;category&quot;:[0,&quot;night_market&quot;],&quot;coordinates&quot;:[0,{&quot;lat&quot;:[0,22.618212799228875],&quot;lng&quot;:[0,120.31782132445248]}],&quot;address&quot;:[0,&quot;806台灣高雄市前鎮區復國里光華二路339號&quot;],&quot;description&quot;:[0,&quot;高雄人私藏美食清單🤤 光華夜市５家必吃，從鱔魚意麵一路吃到手工豆花🔥\n🍜 王家鱔魚麵\n自製麵條加入雞蛋，吃起來特別香！鱔魚意麵酸甜開胃，還有滿滿鍋氣！\n🐟 陳記𩵚魠魚羹\n𩵚魠魚大塊又紮實，搭配濃郁魚羹超滿足！鹹甜夠味的肉燥飯也別錯過！\n🦑 宏現炸大魷魚\n現炸魷魚外酥內Q、不油膩，還有多汁杏鮑菇、波浪薯條和
