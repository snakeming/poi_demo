.16903620387414]}],&quot;navQuery&quot;:[0,&quot;546南投縣仁愛鄉博望巷36之3號&quot;],&quot;description&quot;:[0,&quot;好雞婆土雞城\n\n去 #清境農場 玩不知道吃什麼嗎⁉️\n\n推薦給你們這家合菜料理(不是葉配🍃)，距離 #青青草原 車程只要4分鐘，家人吃下來都一致推薦👍🏻價格合理、分量剛好，環境還超美又舒服，服務人員態度也很親切。\n\n除了在山上平常沒辦法常來吃，不然沒什麼缺點XDD\n\n剛入店時會要先在門口點完餐才帶位唷～座位基本都是包廂，人數較少可能會和其他組人同個包廂，但間隔不會顯得太侷促。\n\n——🅕🅞🅞🅓——\n\n我們是4人用餐，推薦點【雙人套餐再+兩道菜】，份量較剛好，吃完很有飽足感！\n(胃口較小的可以再少點一道菜)\n\n🍗 #雙人烤雞套餐$𝟭𝟭𝟴𝟬\n含香草烤雞、季節時蔬、香椿煎蛋/酥炸刺蔥豆腐、湯品(三擇一) \n\n當天到店內雖然可以現場點烤雞，實際上是要先預訂的，建議可以先和店家確認～\n\n烤雞都是現烤熱騰騰的，有附隔熱手套讓大家扒開雞肉，外皮油亮、烤得有脆度，裡面的雞肉肉質多汁又軟嫩，還有保留雞爪可以ㄘㄥˋ！硬要說缺點的部分是雞頭沒有拔掉(個人稍微比較不愛XD)\n\n時蔬部分我們還有加點一份，所以 #炒高麗菜 和 #甘蔗筍 都有吃到(皆是 $𝟮𝟮𝟬)\n\n高麗菜炒得很有水準，帶有脆度又保有水分，不過略油一點(可以接受的程度)，甘蔗筍搭配黃瓜一起料理，食材都吃得出很新鮮，和高麗菜一樣多汁又有脆度～\n\n湯品選擇的是 #奶奶的鳳梨苦瓜雞 🍲非常推薦✨雞肉和苦瓜都給很多，重點是湯頭：非！常！好！喝！ #不敢吃苦瓜的也會愛喝的湯 ，煮入雞肉的鮮甜和苦瓜的香氣，非常順口、一碗接一碗，喝完也不會口乾舌燥～\n\n(湯品還有 #阿嬤的九尾雞 和 #金針什錦湯 ，九尾雞好像也超多人推，下次也想試)\n\n另外很推薦可以+$𝟮𝟱升級 #雞油拌麵 ，拌麵我們都超愛😋雞油鹹香搭配Q彈麵條超涮嘴，明明飽了卻還是忍不住一直盛‼️\n\n🥢#鹽酥溪蝦豆腐 $𝟰𝟬𝟬\n\n這道推薦給愛吃溪蝦的人🦐因為蝦子真的好多XD溪蝦和豆腐都炸得酥脆，再加上蔥蒜調味，稍微有點辣度🌶️不過比較推薦給口味較重的人，吃到後面會稍鹹一點～\n\n——🅘🅝🅕🅞——\n\n📍 #好雞婆土雞城\n▫️營業時間：週一至週日11:00-14:00、17:00-20:00\n▫️地址：546南投縣仁愛鄉博望巷36之3號\n▫️電話：04 9280 3016&quot;],&quot;url&quot;:[0,&quot;https://www.instagram.com/p/DHImHgoSWnE?igsi=MXQ1cXlicWFlam9kNg%3D%3D&quot;],&quot;rating&quot;:[0,2],&quot;notes&quot;:[1,[]]}],[0,{&quot;id&quot;:[0,&quot;清境_二店_雞大王活蝦啤酒城&quot;],&quot;name&quot;:[0,&quot;二店 雞大王活蝦啤酒城&quot;],&quot;category&quot;:[0,&quot;restaurant&quot;],&quot;coordinates&quot;:[0,{&quot;lat&quot;:[0,24.06692857171721],&quot;lng&quot;:[0,121.16711894896402]}],&quot;navQuery&quot;:[0,&quot;南投縣仁愛鄉仁和路224號附1&quot;],&quot;description&quot;:[0,&quot;這家在Google評論1200多則，有4.7顆星⭐\n點的幾樣特色菜都蠻好吃的👍\n有提供兩人以上套餐或是單點(建議點套餐最划算)\n\n客家香煎芋絲糕  吃得到濃濃的芋頭味，芋頭控必點\n椒麻皮蛋  辣辣麻麻超開胃超級下飯！\n特色菜老台菜煎豬肝  鮮嫩脆口沒有腥味，調味上也好吃，有讓我驚艷到(建議要儘快吃)\n帶有中藥香氣的窯烤甕仔雞  外皮烤得金黃酥脆，撥開還會流湯汁\n因為是使用放山土雞，雞肉吃起來不柴很有口感\n單吃或是沾著特製的胡椒鹽與雞油都好吃\n可以請店員桌邊服務剝雞，或是想要自己剝也可以唷～\n\n他們家的鱘龍魚可是使用合歡山泉水飼養\n有三種料理方式，可以做成湯、清蒸或是三杯（最多可任選2種）\n肉質細緻Ｑ彈沒有土味，不管是三杯或是清蒸都賀甲😋\n香菇雞湯 滿滿的雞肉跟香菇，湯頭甘甜越喝越順口，天冷喝碗熱湯有夠暖身👍\n店內用餐環境寬敞舒適\n停車位也很多，還有民宿至餐廳的免費接駁服務🚗\n（詳細資訊 ot;],&quot;coordinates&quot;:[0,{&quot;lat&quot;:[0,24.074415200688215],&quot;lng&quot;:[0,121.16903620387414]}],&quot;navQuery&quot;:[0,&quot;546南投縣仁愛鄉博望巷36之3號&quot;],&quot;description&quot;:[0,&quot;好雞婆土雞城\n\n去 #清境農場 玩不知道吃什麼嗎⁉️\n\n推薦給你們這家合菜料理(不是葉配🍃)，距離 #青青草原 車程只要4分鐘，家人吃下來都一致推薦👍🏻價格合理、分量剛好，環境還超美又舒服，服務人員態度也很親切。\n\n除了在山上平常沒辦法常來吃，不然沒什麼缺點XDD\n\n剛入店時會要先在門口點完餐才帶位唷～座位基本都是包廂，人數較少可能會和其他組人同個包廂，但間隔不會顯得太侷促。\n\n——🅕🅞🅞🅓——\n\n我們是4人用餐，推薦點【雙人套餐再+兩道菜】，份量較剛好，吃完很有飽足感！\n(胃口較小的可以再少點一道菜)\n\n🍗 #雙人烤雞套餐$𝟭𝟭𝟴𝟬\n含香草烤雞、季節時蔬、香椿煎蛋/酥炸刺蔥豆腐、湯品(三擇一) \n\n當天到店內雖然可以現場點烤雞，實際上是要先預訂的，建議可以先和店家確認～\n\n烤雞都是現烤熱騰騰的，有附隔熱手套讓大家扒開雞肉，外皮油亮、烤得有脆度，裡面的雞肉肉質多汁又軟嫩，還有保留雞爪可以ㄘㄥˋ！硬要說缺點的部分是雞頭沒有拔掉(個人稍微比較不愛XD)\n\n時蔬部分我們還有加點一份，所以 #炒高麗菜 和 #甘蔗筍 都有吃到(皆是 $𝟮𝟮𝟬)\n\n高麗菜炒得很有水準，帶有脆度又保有水分，不過略油一點(可以接受的程度)，甘蔗筍搭配黃瓜一起料理，食材都吃得出很新鮮，和高麗菜一樣多汁又有脆度～\n\n湯品選擇的是 #奶奶的鳳梨苦瓜雞 🍲非常推薦✨雞肉和苦瓜都給很多，重點是湯頭：非！常！好！喝！ #不敢吃苦瓜的也會愛喝的湯 ，煮入雞肉的鮮甜和苦瓜的香氣，非常順口、一碗接一碗，喝完也不會口乾舌燥～\n\n(湯品還有 #阿嬤的九尾雞 和 #金針什錦湯 ，九尾雞好像也超多人推，下次也想試)\n\n另外很推薦可以+$𝟮𝟱升級 #雞油拌麵 ，拌麵我們都超愛😋雞油鹹香搭配Q彈麵條超涮嘴，明明飽了卻還是忍不住一直盛‼️\n\n🥢#鹽酥溪蝦豆腐 $𝟰𝟬𝟬\n\n這道推薦給愛吃溪蝦的人🦐因為蝦子真的好多XD溪蝦和豆腐都炸得酥脆，再加上蔥蒜調味，稍微有點辣度🌶️不過比較推薦給口味較重的人，吃到後面會稍鹹一點～\n\n——🅘🅝🅕🅞——\n\n📍 #好雞婆土雞城\n▫️營業時間：週一至週日11:00-14:00、17:00-20:00\n▫️地址：546南投縣仁愛鄉博望巷36之3號\n▫️電話：04 9280 3016&quot;],&quot;url&quot;:[0,&quot;https://www.instagram.com/p/DHImHgoSWnE?igsi=MXQ1cXlicWFlam9kNg%3D%3D&quot;],&quot;rating&quot;:[0,2],&quot;notes&quot;:[1,[]],&quot;waypointIndex&quot;:[0],&quot;tier&quot;:[0,&quot;recommended&quot;]}],[0,{&quot;id&quot;:[0,&quot;南投_七里香甕仔雞-清境埔霧公路店&quot;],&quot;name&quot;:[0,&quot;七里香甕仔雞-清境埔霧公路店&quot;],&quot;category&quot;:[0,&quot;restaurant&quot;],&quot;coordinates&quot;:[0,{&quot;lat&quot;:[0,23.979550485051778],&quot;lng&quot;:[0,121.01023836035016]}],&quot;navQuery&quot;:[0,&quot;南投縣埔里鎮中山路一段171號&quot;],&quot;description&quot;:[0,&quot;超爆汁的甕仔雞💦 高CP值多人聚餐出遊推薦 #七里香甕仔雞\n-\n多人套餐\n◻️三菜一湯B（2-4人） $980\n。甕仔雞 \n。雪花肉炒脆瓜 。酸筍絲炒空心菜\n。筍湯 。大碗公白飯\n選擇障礙的人直接點配好的套餐就對了！而且筍湯和白飯都可以無限續🙌🏻\n甕仔雞都是燒柴火控窯，由專人掌握做精準的熟度。雞皮色澤超美！油亮油亮還超多汁！外皮酥脆、肉質嫩口juicy\n雪花肉炒脆瓜也是一道下飯神菜耶～脆瓜鹹香帶點酸、尾韻還有點甜\n空心菜搭配大量的蒜頭爆炒，酸筍更帶出了不同
