 ✿ </div></div><!--astro:end--></astro-island> <script id="tips-default-data" type="application/json">[{"id":"tip-toll","title":"國道電子收費 (eTag)","content":"租車時確認是否已裝 eTag。沒有 eTag 的車牌辨識會收到繳費單，建議提前在 7-11 或全家便利店繳納，避免逾期罰款。","url":"https://www.freeway.gov.tw/Publish.aspx?cnid=2855","createdAt":1730000000000},{"id":"tip-parking","title":"停車 App 推薦","content":"下載「停車即時資訊」或「Find Parking」App，市區找車位很方便。阿里山停車場週末很早滿，建議 9 點前抵達。","url":"","createdAt":1730000100000},{"id":"tip-alishan-forest","title":"阿里山森林步道","content":"巨木區步道可能因施工調整動線，出發前查看阿里山國家森林遊樂區官網公告。沼平車站到姊妹潭往返約 40 分鐘，輕裝即可。","url":"https://recreation.forest.gov.tw/RA/RA_1_1.aspx?RA_ID=040002","createdAt":1730000200000},{"id":"tip-qingjing","title":"清境農場羊秀時間","content":"青青草原綿羊秀通常每天 10:00 和 14:00 各一場，每場約 30 分鐘。週日人多建議提前 15 分鐘佔位。門票可現場購買。","url":"","createdAt":1730000300000},{"id":"tip-sunmoonlake","title":"日月潭自行車","content":"水社碼頭附近有多家自行車出租，約 NT$100-150/小時。向山單車道平坦好騎，全程約 3km，適合全家。日落前光線最美。","url":"","createdAt":1730000400000},{"id":"tip-guanziling","title":"關子嶺泥漿溫泉","content":"泥漿溫泉是全台灣獨一無二的泉質。部分民宿有私人湯屋（推薦京岄山居），不用人擠人。泡完記得用清水沖洗，泥漿會乾在皮膚上。","url":"","createdAt":1730000500000},{"id":"tip-tainan-food","title":"台南國華街覓食","content":"國華街是台南小吃一級戰區。阿霞飯店、富盛號碗粿、金得春捲都排隊名店。建議下午 2-4 點避開尖峰，或早上 10 點開門就去。","url":"","createdAt":1730000600000},{"id":"tip-cash","title":"現金準備","content":"山區（清境、阿里山）和傳統市場很多店家只收現金。建議每天準備 NT$2000-3000 現金。加油站大部分可刷卡。","url":"","createdAt":1730000700000}]</script>  </main> </body></html>
